<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pendaftaran pasukan Kejohanan Bola Tampar Remaja B16 Malaysia 2026 (Borang O-2 dan O-2Bis)">
<link rel="icon" href="flags/MY-14.svg">
<title>Pendaftaran B16 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: hero is an indoor court seen from above (orange court, blue free zone, white lines) carrying the title and countdown;
   below it, a board of 16 state cards each carrying its flag; the team form is a stack of sections with a sticky section switcher. */
:root{
  --paper:#eef2f8; --surface:#ffffff; --sunk:#e3e9f2; --rule:#cfd8e5;
  --ink:#0f1d33; --muted:#566377;
  --zone:#1b4c9e; --zone-deep:#123a7c; --court:#e46f24; --court-ink:#ffffff; --chalk:#ffffff;
  --gold:#f6c343;
  --ok:#11734a; --ok-bg:#d9f2e5; --warn:#94560a; --warn-bg:#fcecd0; --bad:#b3242c; --bad-bg:#fbe1e3;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1626; --surface:#132137; --sunk:#1a2a44; --rule:#263a58; --ink:#e7eef8; --muted:#97a7bd;
  --zone:#173f86; --zone-deep:#0f2d63; --court:#dd6a22; --gold:#f7cd5e;
  --ok:#5fd59d; --ok-bg:#12382a; --warn:#f2b864; --warn-bg:#3b2a12; --bad:#ff8d93; --bad-bg:#3e1b20; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1626; --surface:#132137; --sunk:#1a2a44; --rule:#263a58; --ink:#e7eef8; --muted:#97a7bd;
  --zone:#173f86; --zone-deep:#0f2d63; --court:#dd6a22; --gold:#f7cd5e;
  --ok:#5fd59d; --ok-bg:#12382a; --warn:#f2b864; --warn-bg:#3b2a12; --bad:#ff8d93; --bad-bg:#3e1b20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;font-weight:600;border-radius:8px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);padding:8px 16px;cursor:pointer;min-height:40px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--zone)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--zone);color:#fff;border-color:var(--zone)}
button.primary:hover{background:var(--zone-deep)}
button.serve{background:var(--court);color:var(--court-ink);border-color:var(--court)}
button.serve:hover{filter:brightness(1.06)}
button:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Hero: the court ---------- */
.hero{background:var(--zone);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;padding-block:22px 30px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;grid-column:1/-1}
.org{font-weight:600;font-size:14px;opacity:.9}
.lang{display:inline-flex;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;border-radius:0;min-height:32px;padding:4px 14px;font-weight:700;font-size:13px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--zone)}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,6.2vw,80px);line-height:.9;margin:6px 0 16px;overflow-wrap:anywhere;letter-spacing:-.005em;text-wrap:balance;text-transform:uppercase}
.hero h1 .yr{display:block;color:var(--gold);white-space:nowrap}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px}
.hero .facts span{display:flex;flex-direction:column}
.hero .facts small{opacity:.75;font-size:12.5px}
.hero .facts b{font-weight:600}
.court{position:relative;aspect-ratio:2/1;max-width:100%;width:100%;background:var(--court);border:3px solid var(--chalk);border-radius:2px;box-shadow:0 0 0 14px rgba(255,255,255,.06)}
.court::before{content:"";position:absolute;inset:0 auto 0 50%;width:4px;margin-left:-2px;background:var(--chalk)}
.court .att{position:absolute;top:0;bottom:0;width:2px;background:var(--chalk);opacity:.45}
.court .att.l{left:33.33%}.court .att.r{right:33.33%}
.court .net{position:absolute;left:50%;top:-14px;bottom:-14px;width:10px;margin-left:-5px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.95) 0 2px,transparent 2px 7px);border-left:2px solid #fff;border-right:2px solid #fff;opacity:.55}
.court .count{position:absolute;inset:0 50% 0 0;display:grid;place-content:center;text-align:center;color:var(--court-ink)}
.court .count b{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,10vw,120px);line-height:.85}
.court .count span{font-weight:600;font-size:14px;max-width:14ch;margin:4px auto 0}
.court .side{position:absolute;inset:0 0 0 50%;display:grid;place-content:center;text-align:center;color:var(--court-ink);padding:8px}
.court .side b{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,54px);line-height:.9}
.court .side span{font-size:13.5px;font-weight:600;opacity:.95}
.ball{position:absolute;width:26px;height:26px;border-radius:50%;right:6%;top:9%;background:conic-gradient(from 20deg,var(--gold) 0 33%,#1f5fc4 0 66%,#fff 0);box-shadow:0 6px 0 rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.ball{animation:serve 1.6s cubic-bezier(.3,.6,.4,1) .3s both}
@keyframes serve{from{transform:translate(-260%,160%) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.court{max-width:520px}}

/* ---------- Board ---------- */
main .wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
.boardhead{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,40px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.005em}
.sub{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:60ch}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px;padding:6px 18px}
.seg button[aria-pressed="true"]{background:var(--zone);color:#fff;box-shadow:0 1px 2px rgba(15,29,51,.2)}
.progress{display:grid;gap:8px}
.progress .bar{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.progress .bar i{height:10px;border-radius:2px;background:var(--sunk)}
.progress .bar i.draf{background:var(--gold)}
.progress .bar i.hantar{background:var(--ok)}
.progress .txt{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.progress .txt b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{display:grid;grid-template-columns:52px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:6px 12px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface);font-weight:400;min-height:0;position:relative}
.team:hover{border-color:var(--zone);background:var(--surface)}
.flag{width:46px;height:30px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(15,29,51,.18)}
.flag i{flex:1}
.team .flag{grid-column:1;grid-row:1}
.team .nm{grid-column:2;grid-row:1;font-weight:700;font-size:15.5px;line-height:1.2;min-width:0;min-height:2.4em;display:flex;align-items:center}
.team .cd{grid-column:3;grid-row:1;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted);opacity:.6;line-height:1;letter-spacing:.02em}
.team .st{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);padding-top:8px;border-top:1px solid var(--rule)}
.team .st .chip{grid-column:1;grid-row:1;justify-self:start}
.team .st .cnt{grid-column:1/-1;grid-row:2;white-space:nowrap;font-variant-numeric:tabular-nums;min-height:1.4em}
.team .st .lock{grid-column:3;grid-row:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.none{background:var(--sunk);color:var(--muted)}
.chip.draf{background:var(--warn-bg);color:var(--warn)}
.chip.hantar{background:var(--ok-bg);color:var(--ok)}
.notice{border-radius:10px;padding:12px 16px;font-size:14px;background:var(--surface);border:1.5px solid var(--rule)}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.notice.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.notice ul{margin:6px 0 0;padding-left:20px}

/* ---------- Team form ---------- */
.teamband{background:var(--zone);color:#fff}
.teamband .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.teamtop{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.teamtop .who{display:flex;gap:16px;align-items:center;min-width:0}
.teamtop .flag{width:64px;height:42px;grid-row:auto;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.teamtop h2{font-size:clamp(32px,5vw,52px);color:#fff}
.teamtop .cat{font-weight:600;opacity:.85;font-size:14px}
.teamtop .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;opacity:.95}
.back{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.back:hover{border-color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:#fff;text-decoration:none;padding:10px 16px 12px;font-weight:600;font-size:14.5px;border-radius:8px 8px 0 0;white-space:nowrap;opacity:.8;display:flex;gap:8px;align-items:center}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.08)}
.tabs a .n{font-size:12px;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 8px}
.tabs a .n.done{background:var(--gold);color:var(--ink)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--zone)}
#formView .wrap.body{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
section.block{background:var(--surface);border-radius:14px;border:1.5px solid var(--rule);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:70px}
.blockhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
h3{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;margin:0;text-transform:uppercase}
.hint{color:var(--muted);font-size:13.5px;max-width:62ch}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1.5px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:4px;text-align:left;vertical-align:middle}
tbody tr{border-top:1px solid var(--rule)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--sunk) 45%,transparent)}
thead th{background:var(--sunk);font-weight:700;font-size:12.5px;color:var(--muted);padding:8px 6px;line-height:1.2;white-space:nowrap}
thead tr.grp th{text-align:center;font-size:12px;padding-bottom:0;font-weight:600}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:7px;padding:7px 10px;min-height:38px;width:100%;min-width:0}
td input{background:transparent;border-color:transparent;min-height:34px;padding:5px 7px}
td input:hover{border-color:var(--rule)}
td input:focus{background:var(--surface);border-color:var(--zone)}
input.err,td input.err{border-color:var(--bad);background:var(--bad-bg)}
td.num{text-align:center;width:36px;color:var(--muted);font-weight:600;font-size:13px}
td.age{text-align:center;font-weight:700;white-space:nowrap}
td.age.over{color:var(--bad)}
.players td input{min-width:72px}
.players td.w-no input{min-width:54px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--court)}
.players td.w-name input{min-width:230px;font-weight:600}
.players td.w-ic input{min-width:150px;letter-spacing:.02em}
.players td.w-dob input{min-width:140px}
.players td.w-sm input{min-width:66px;text-align:center}
.officials td input{min-width:190px}
.officials td b{font-weight:600;white-space:nowrap}
.uni{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.kit{border:1.5px solid var(--rule);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
.kit .sw{grid-row:span 2;width:54px;height:62px;display:grid;justify-items:center;gap:2px}
.kit .sw i{display:block;border:1.5px solid var(--rule)}
.kit .sw .shirt{width:54px;height:34px;border-radius:12px 12px 4px 4px;background:var(--sunk)}
.kit .sw .shorts{width:40px;height:22px;border-radius:3px 3px 8px 8px;background:var(--sunk)}
.kit h4{grid-column:2;margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase}
.kit .row{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.decl{margin:0;font-size:15px;max-width:66ch;line-height:1.6}
.legend{font-size:13px;color:var(--muted)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.authbtn{background:#fff;color:var(--zone);border-color:#fff;min-height:32px;padding:4px 14px;font-size:13px;border-radius:999px}
.topbar .right{display:flex;gap:8px;align-items:center}
dialog{border:0;border-radius:16px;padding:0;max-width:min(420px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(10,25,50,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{font-size:26px}
.dlg select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:7px;padding:8px 10px;min-height:40px;width:100%}
.dlg input{font-size:20px;letter-spacing:.3em;text-align:center}
.dlg .err{color:var(--bad);font-weight:600;font-size:14px;min-height:1.2em}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.team .lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.team .lock svg{width:13px;height:13px}
.team.open .lock{color:var(--ok)}
.dlg .who{display:flex;gap:12px;align-items:center}
.dlg .who .flag{width:54px;height:36px}
.dlg .who b{font-family:var(--f-display);font-size:28px;font-weight:800;text-transform:uppercase;line-height:1}
.flag{background:var(--sunk)}
.flag img{display:block;width:100%;height:100%;object-fit:cover}
.up{text-transform:uppercase}
.finbar{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill b{color:var(--ink);font-weight:800}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.ok b{color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.bad b{color:var(--bad)}
.fin{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.frow{display:grid;grid-template-columns:auto auto minmax(0,1fr) 68px auto;gap:10px;align-items:center;padding:8px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--surface)}
.frow.on{border-color:var(--zone);background:color-mix(in srgb,var(--zone) 7%,var(--surface))}
.frow input[type=checkbox],.frow input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--zone);margin:0}
.frow .jn{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--court);min-width:30px;text-align:center}
.frow .pn{font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.frow select{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:7px;padding:5px 6px;min-height:34px}
.frow .cap{display:flex;gap:4px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.frow:not(.on) select,.frow:not(.on) .cap{opacity:.35}
.empty{padding:18px;border:1.5px dashed var(--rule);border-radius:10px;color:var(--muted);text-align:center}
.cardsub{font-size:12px;color:var(--muted);font-weight:600}
.sticky-actions{position:sticky;bottom:0;z-index:7;background:var(--surface);border-top:1.5px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.sticky-actions .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.status-line{font-size:13.5px;color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--zone)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div id="boardView">
  <header class="hero">
    <div class="wrap">
      <div class="topbar">
        <span class="org" data-i18n="org"></span>
        <div class="right">
        <button type="button" class="authbtn" id="authBtn"></button>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="langEN" lang="en">EN</button>
          <button type="button" id="langMS" lang="ms">BM</button>
        </div>
        </div>
      </div>
      <div>
        <h1><span data-i18n="title1"></span><span class="yr" data-i18n="title2"></span></h1>
        <div class="facts">
          <span><small data-i18n="f_dates"></small><b>14–18 Nov 2026</b></span>
          <span><small data-i18n="f_venue"></small><b>Kota Kinabalu, Sabah</b></span>
          <span><small data-i18n="f_close"></small><b data-i18n="deadline"></b></span>
        </div>
      </div>
      <div class="court" aria-hidden="false">
        <i class="att l"></i><i class="att r"></i><i class="net"></i><span class="ball"></span>
        <div class="count"><b id="cdN">–</b><span id="cdT"></span></div>
        <div class="side"><b id="sideN">0/32</b><span data-i18n="sideT"></span></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="boardhead">
        <div>
          <h2 data-i18n="teamsH"></h2>
          <div class="sub" data-i18n="teamsSub"></div>
        </div>
        <div class="ctrl">
          <div class="seg" role="group" aria-label="Category">
            <button type="button" id="segL" aria-pressed="true" data-i18n="men"></button>
            <button type="button" id="segP" aria-pressed="false" data-i18n="women"></button>
          </div>
          <button type="button" id="exportAll" data-i18n="exportAll"></button>
        </div>
      </div>
      <div class="progress"><div class="bar" id="pbar"></div><div class="txt" id="summary"></div></div>
      <div id="dbNotice" class="notice" hidden></div>
      <div class="board" id="board"></div>
    </div>

function ageAt(dob){

function validate(f){
  const errs=[];document.querySelectorAll("input.err").forEach(e=>e.classList.remove("err"));
  const ps=f.players.map((p,i)=>[p,i]).filter(([p])=>p.name.trim()||p.ic.trim()||p.no.trim());
  if(ps.length<MINPLAYERS) errs.push(T("v_min")(MINPLAYERS,ps.length));
  const nos={};
  ps.forEach(([p,i])=>{
    const tag=T("v_pl")(i+1)+": ";
    if(!p.name.trim()){errs.push(tag+T("v_name"));$(`p${i}_name`)?.classList.add("err")}
    if(icDigits(p.ic).length!==12){errs.push(tag+T("v_ic"));$(`p${i}_ic`)?.classList.add("err")}
    const no=p.no.trim();
    if(!no){errs.push(tag+T("v_no"));$(`p${i}_no`)?.classList.add("err")}
    else if(nos[no]){errs.push(tag+T("v_dup")(no,nos[no]));$(`p${i}_no`)?.classList.add("err")}
    else nos[no]=i+1;
  });
  [0,1].forEach(i=>{const lbl=T("offs")[i]+": ";
    if(!f.officials[i].name.trim()){errs.push(lbl+T("v_offn"));$(`o${i}_name`)?.classList.add("err")}
    if(!f.officials[i].tel.trim()){errs.push(lbl+T("v_offt"));$(`o${i}_tel`)?.classList.add("err")}});
  if(!f.uniform.shirt1.trim()||!f.uniform.shirt2.trim()) errs.push(T("v_uni"));
  const fp=f.players.filter(p=>p.final&&p.name.trim());
  if(fp.length){
    if(fp.length>14) errs.push(T("v_fmax")(fp.length));
    const caps=fp.filter(p=>p.captain).length; if(caps!==1) errs.push(T("v_fcap"));
    fp.forEach(p=>{if(!p.pos) errs.push(T("v_fpos")(p.no||"?",p.name))});
    if(fp.filter(p=>p.pos==="L").length>2) errs.push(T("v_flib"));
  }
  return errs;
}
async function save(submit,auto){
  if(!form||!session||readOnly) return;
  if(saving){if(auto)scheduleSave();return}
  const v=$("valNotice");
  if(submit){
    const errs=validate(form);
    if(errs.length){v.innerHTML="<b></b><ul></ul>";v.querySelector("b").textContent=T("v_head");const ul=v.querySelector("ul");
      errs.slice(0,12).forEach(e=>{const li=document.createElement("li");li.textContent=e;ul.appendChild(li)});
      if(errs.length>12){const li=document.createElement("li");li.textContent=T("v_more")(errs.length-12);ul.appendChild(li)}
      v.hidden=false;v.scrollIntoView({behavior:"smooth",block:"start"});return}
    v.hidden=true;
  }
  if(auto&&!dirty)return;
  clearTimeout(autoT);
  const id=teamId(current.code,current.sex),now=Date.now(),snapshot=JSON.stringify(form);
  const body=JSON.parse(snapshot);body.updatedAt=now;delete body.dummy;
  if(submit){body.status="hantar";body.submittedAt=now}
  if(!auto)setSaveState(T("ss_saving"));
  saving=true;$("saveBtn").disabled=$("submitBtn").disabled=true;
  try{
    const r=await api("b16_save",{p_code:session.code,p_pin:session.pin,p_id:id,p_data:body,p_status:body.status||"draf",p_base:base});
    if(r&&r.error){
      if(r.error==="conflict"){$("remoteNotice").hidden=false;setSaveState(T("ss_conflict"));return}
      if(r.error==="bad_pin"||r.error==="locked"){logout(true);setSaveState(T("l_bad"));openLogin(current.code,()=>save(submit,auto));return}
      if(r.error==="forbidden"){readOnly=true;renderForm();setSaveState(T("ss_ro"));return}
      throw new Error(r.error);
    }
    const unchanged=JSON.stringify(form)===snapshot;
    base=r.updated_at;form.updatedAt=now;if(submit){form.status="hantar";form.submittedAt=now}
    full[id]={data:body,updated_at:base};
    meta[id]={status:body.status||"draf",updated_at:base,players:filledPlayers(normalise(body,current.code,current.name,current.sex)).length,finals:body.players.filter(p=>p.final&&p.name.trim()).length};
    if(unchanged){dirty=false;dropLocal(id)}else{keepLocal();scheduleSave()}
    $("remoteNotice").hidden=true;renderHead();setSaveState();
    if(!auto)toast(T(submit?"t_sub":"t_saved"));
  }catch(e){
    keepLocal();setSaveState(T("ss_fail"));if(auto){clearTimeout(autoT);autoT=setTimeout(()=>save(false,true),15000)}
  }finally{saving=false;if(!readOnly){$("saveBtn").disabled=$("submitBtn").disabled=false}}
}

    else{c.setAttribute("t","inlineStr");const is=doc.createElementNS(SNS,"is"),t=doc.createElementNS(SNS,"t");t.setAttributeNS(XMLNS,"xml:space","preserve");t.textContent=String(v);is.appendChild(t);c.appendChild(is)}
  }
  return {set,out:()=>XDECL+new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/,"")};
}
const UP=v=>(v||"").toUpperCase();
function fillO2(ed,f){
  f.players.slice(0,20).forEach((p,i)=>{const r=9+i;
    ed.set("A"+r,numOr(p.no));ed.set("C"+r,UP(p.name));ed.set("F"+r,p.chinese);ed.set("H"+r,p.ic);
    ed.set("K"+r,xlDate(p.dob));ed.set("L"+r,numOr(p.weight));ed.set("M"+r,numOr(p.height));ed.set("N"+r,numOr(p.spike));
    ed.set("O"+r,numOr(p.block));ed.set("P"+r,numOr(p.intl));ed.set("Q"+r,numOr(p.natl));ed.set("R"+r,numOr(p.other))});
  f.officials.forEach((o,i)=>{const r=32+i;ed.set("E"+r,UP(o.name));ed.set("H"+r,o.tel)});
  ed.set("D42",UP(f.uniform.shirt1));ed.set("E42",UP(f.uniform.shirt2));ed.set("D44",UP(f.uniform.shorts1));ed.set("E44",UP(f.uniform.shorts2));
}
function fillO2Bis(ed,f){
  f.players.filter(p=>p.final&&(p.name||"").trim()).slice(0,14).forEach((p,i)=>{const r=9+i;
    ed.set("A"+r,p.captain?circ(p.no):numOr(p.no));ed.set("C"+r,p.pos||"");ed.set("E"+r,UP(p.name));ed.set("H"+r,p.chinese);ed.set("J"+r,p.ic);
    ed.set("M"+r,xlDate(p.dob));ed.set("N"+r,numOr(p.weight));ed.set("O"+r,numOr(p.height));ed.set("P"+r,numOr(p.spike));
    ed.set("Q"+r,numOr(p.block));ed.set("R"+r,numOr(p.intl));ed.set("S"+r,numOr(p.natl));ed.set("T"+r,numOr(p.other))});
  const o=f.officials;
  ed.set("H27",UP(o[0].name));ed.set("H29",o[0].tel);ed.set("H34",UP(o[1].name));ed.set("H36",o[1].tel);
  [2,3,4,5].forEach((k,j)=>{const nm=UP(o[k].name);if(nm)ed.set("G"+(41+j),nm+(o[k].tel?"   TEL: "+o[k].tel:""))});
  ed.set("P28",UP(f.uniform.shirt1));ed.set("R28",UP(f.uniform.shirt2));ed.set("P29",UP(f.uniform.shorts1));ed.set("R29",UP(f.uniform.shorts2));
}
function fillShapes(xml,f){
  const v={TEAM:UP(f.state),CODE:f.code,M:f.sex==="L"?"X":"",W:f.sex==="P"?"X":"",SEC:UP(f.secretary),PRES:UP(f.president)};
  return xml.replace(/\{\{(\w+)\}\}/g,(m,k)=>xesc(v[k]??""));
}
let tplBuf=null;async function getTpl(){if(!tplBuf){const r=await fetch("templates/O-2_O-2Bis.xlsx",{cache:"no-cache"});if(!r.ok)throw new Error("template");tplBuf=await r.arrayBuffer()}return tplBuf}
function libsReady(){return typeof JSZip!=="undefined"}
async function buildTeamBook(f){
  const zip=await JSZip.loadAsync(await getTpl());
  const e1=sheetEditor(await zip.file("xl/worksheets/sheet1.xml").async("string"));fillO2(e1,f);zip.file("xl/worksheets/sheet1.xml",e1.out());
  const e2=sheetEditor(await zip.file("xl/worksheets/sheet2.xml").async("string"));fillO2Bis(e2,f);zip.file("xl/worksheets/sheet2.xml",e2.out());
  for(const d of ["xl/drawings/drawing1.xml","xl/drawings/drawing2.xml"])zip.file(d,fillShapes(await zip.file(d).async("string"),f));
  return zip.generateAsync({type:"arraybuffer",compression:"DEFLATE"});
}
const XMIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
async function offer(blob,filename){
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast(T("t_dlok"));
}
$("dlOne").addEventListener("click",async()=>{
  if(!form) return;if(!libsReady()){toast(T("t_noxl"));return}
  try{const buf=await buildTeamBook(form);await offer(new Blob([buf],{type:XMIME}),T("x_file1")(form.code,form.sex))}
  catch(e){toast(T("t_dlfail")+(e.message||e))}
});
$("exportAll").addEventListener("click",async()=>{
  if(!libsReady()||typeof ExcelJS==="undefined"){toast(T("t_noxl"));return}
  toast(T("t_building"));
  try{
    const zip=new JSZip();
    const sw=new ExcelJS.Workbook();const ws1=sw.addWorksheet(T("x_sum")),ws2=sw.addWorksheet(T("x_all")),ws3=sw.addWorksheet("O-2Bis");
    ws1.addRow(T("x_hdrSum"));ws2.addRow(T("x_hdrAll"));ws3.addRow(T("x_hdrFin"));
    for(const sx of ["L","P"]) for(const [code,name] of STATES){
      const t=full[teamId(code,sx)];const kat=T(sx==="L"?"men":"women");
      if(!t){ws1.addRow([code,name,kat,T("st_none"),0,0]);continue}
      const f=normalise(t.data,code,name,sx);const ps=filledPlayers(f);const fp=f.players.filter(p=>p.final&&p.name.trim());
      ws1.addRow([code,name,kat,T(stKey(f.status==="hantar"?"hantar":"draf")),ps.length,fp.length,f.officials[0].name,f.officials[0].tel,f.officials[1].name,f.officials[1].tel,f.updatedAt?new Date(f.updatedAt).toLocaleString(T("locale")):""]);
      ps.forEach(p=>ws2.addRow([code,name,kat,p.no,p.name,p.chinese,p.ic,p.dob,ageAt(p.dob)??"",p.weight,p.height,p.spike,p.block,p.intl,p.natl,p.other]));
      fp.forEach(p=>ws3.addRow([code,name,kat,p.no,p.pos,p.captain?"C":"",p.name,p.ic,p.dob]));
      zip.file(T("x_file1")(code,sx),await buildTeamBook(f));
    }
    [ws1,ws2,ws3].forEach(w=>{w.getRow(1).font={bold:true};w.columns.forEach(c=>c.width=16)});
    zip.file(T("x_sumFile"),await sw.xlsx.writeBuffer());
    await offer(await zip.generateAsync({type:"blob"}),T("x_fileAll"));
  }catch(e){toast(T("t_dlfail")+(e.message||e))}
});
$("segL").addEventListener("click",()=>{sex="L";renderBoard()});
$("segP").addEventListener("click",()=>{sex="P";renderBoard()});
$("backBtn").addEventListener("click",()=>{const b=$("backBtn");
  if(dirty&&!b.dataset.confirm){b.dataset.confirm="1";b.textContent=T("backConfirm");setTimeout(()=>{delete b.dataset.confirm;b.textContent=T("back")},4000);return}
  delete b.dataset.confirm;b.textContent=T("back");closeTeam()});
$("saveBtn").addEventListener("click",()=>save(false));
$("submitBtn").addEventListener("click",()=>save(true));
$("reloadRemote").addEventListener("click",async()=>{const id=teamId(current.code,current.sex);dropLocal(id);await loadFull();openTeam(current.code,current.name,current.sex)});

function renderCountdown(){
  const now=new Date();const a=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()),b=Date.UTC(2026,10,14);
  const n=Math.round((b-a)/864e5);$("cdN").textContent=n>=0?n:"—";$("cdT").textContent=T("cd")(n);
}
document.querySelectorAll(".tabs a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();const t=document.querySelector(a.getAttribute("href"));
  if(t)t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}));
function showNotice(cls,key,arg){noticeKey=key;noticeArg=arg;const n=$("dbNotice");n.hidden=false;n.className="notice "+cls;const f=T(key);n.textContent=typeof f==="function"?f(arg):f}
applyLang();
function renderAuth(){const b=$("authBtn");b.textContent=session?T("logout")(session.code==="ADMIN"?"Admin":session.code):T("login")}
function logout(silent){session=null;full={};try{sessionStorage.removeItem("b16s")}catch(e){}renderAuth();if(!silent){if(current&&!dirty)closeTeam();else renderBoard()}}
let afterLogin=null;
function openLogin(code,then){
  afterLogin=then||null;const sel=$("lCode");sel.innerHTML="";
  STATES.forEach(([c,n])=>{const o=document.createElement("option");o.value=c;o.textContent=n;sel.appendChild(o)});
  const o=document.createElement("option");o.value="ADMIN";o.textContent=T("l_admin");sel.appendChild(o);
  const fixed=!!code&&code!=="ADMIN";sel.value=code||"JHR";
  $("lWho").hidden=!fixed;$("lPick").hidden=fixed;
  if(fixed){const st=STATES.find(x=>x[0]===code);paintFlag($("lFlag"),code,st[1]);$("lName").textContent=st[1]}
  $("lPin").value="";$("lErr").textContent="";
  try{$("loginDlg").showModal()}catch(e){$("loginDlg").setAttribute("open","")}
  setTimeout(()=>$("lPin").focus(),50);
}
$("lPin").addEventListener("input",e=>{const v=e.target.value.replace(/\D/g,"");if(v!==e.target.value)e.target.value=v;$("lErr").textContent="";
  if($("lCode").value!=="ADMIN"&&v.length===6)$("loginForm").requestSubmit()});
$("authBtn").addEventListener("click",()=>{if(session){if(dirty&&current)save(false,true);logout()}else openLogin()});
$("lCancel").addEventListener("click",()=>$("loginDlg").close());
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const code=$("lCode").value,pin=$("lPin").value.trim();$("lErr").textContent="";$("lGo").disabled=true;
  try{
    const r=await api("b16_login",{p_code:code,p_pin:pin});
    if(r==="admin"||r==="state"){
      session={code,pin,role:r};try{sessionStorage.setItem("b16s",JSON.stringify(session))}catch(e){}
      $("loginDlg").close();renderAuth();await loadFull();renderBoard();const f=afterLogin;afterLogin=null;if(f)f();
    }else{$("lErr").textContent=T(r==="locked"?"l_locked":"l_bad");$("lPin").value="";$("lPin").focus()}
  }catch(err){$("lErr").textContent=T("l_net")}finally{$("lGo").disabled=false}
});
async function loadBoard(){
  const rows=await api("b16_board");const m={};(rows||[]).forEach(r=>m[r.id]=r);meta=m;
}
async function loadFull(){
  if(!session)return;
  const r=await api("b16_get",{p_code:session.code,p_pin:session.pin});
  if(r&&r.error){logout(true);return}
  const f={};(r.teams||[]).forEach(t=>f[t.id]={data:t.data,updated_at:t.updated_at});full=f;
}
async function refresh(first){
  try{
    await loadBoard();
    if(session&&(first||!current||!dirty))await loadFull();
    $("dbNotice").hidden=true;noticeKey=null;
  }catch(e){showNotice("bad","n_err",e.message||"network");return}
  if(current){
    const id=teamId(current.code,current.sex),m=meta[id];
    if(m&&base&&m.updated_at!==base&&!saving){
      if(dirty)$("remoteNotice").hidden=false;
      else if(full[id]){form=normalise(full[id].data,current.code,current.name,current.sex);base=full[id].updated_at;renderForm()}
    }
  }else renderBoard();
  if(first){const m=/^([A-Z]{3})-(L|P)$/.exec((location.hash||"").slice(1));
    if(m&&!current){const s=STATES.find(x=>x[0]===m[1]);if(s){sex=m[2];if(canOpen(s[0]))openTeam(s[0],s[1],m[2]);else{renderBoard();openLogin(s[0],()=>openTeam(s[0],s[1],m[2]))}}}}
}
window.addEventListener("beforeunload",e=>{if(dirty){keepLocal();e.preventDefault();e.returnValue=""}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&dirty){keepLocal();save(false,true)}});
renderAuth();
refresh(true);
setInterval(()=>{if(document.visibilityState==="visible")refresh(false)},45000);
</script>
